name: validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Parse browser modules
        run: |
          node --check client/game.js
          node --check client/world.js
          node --check client/audio.js
          node --check client/ragdoll.js
          node --check client/soldier_skin.js
          node --check client/combat_plus.js
          node --check client/playground.js
          node --check client/input_guard.js
      - name: Verify playground entrypoint
        run: |
          grep -q 'GHOSTCAM' client/index.html
          grep -q 'RAGDOLL PLAYGROUND' client/index.html
          grep -q './playground.js' client/index.html
          grep -q './game.js' client/index.html
          test ! -e worker/src/index.ts
      - name: Guard movement collision regression
        run: |
          # The floor must remain a Rapier collider but must never enter the X/Z obstacle list,
          # otherwise every player/AI move and every LOS query is blocked by the whole map.
          grep -Fq 'fixedBox(0,-.15,0,70,.3,70,groundMat,true,false)' client/world.js
          grep -Fq 'if(navCollide)obstacles.push' client/world.js
          # T-spawned/reset playground dummies live outside game.js soldiers[] and need their own tick.
          grep -Fq 's.__playgroundStandalone=true' client/playground.js
          grep -Fq 'if(s.__playgroundStandalone&&!s.__playgroundDisposed)s.update?.(dt,now)' client/playground.js
