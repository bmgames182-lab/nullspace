name: validate
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  client:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check syntax and simulate active ragdoll
        run: npm run check
      - name: Verify focused entrypoint
        run: |
          grep -Fq 'ACTIVE BODY LAB' client/index.html
          grep -Fq './euphoria_lab.js' client/index.html
          grep -Fq 'ONE HUMAN' client/index.html
          grep -Fq 'ONE WEAPON' client/index.html
          ! grep -Eq './(game|warzone|combat_plus).js' client/index.html
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Exercise FPS, blood FX, and targeted body hits in browser
        run: npm run test:browser
      - name: Capture deterministic visual physics audit
        run: npm run audit:visual
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence
          path: test-results/
          if-no-files-found: ignore
