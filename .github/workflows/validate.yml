name: validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Parse browser modules
        run: |
          node --check client/game.js
          node --check client/world.js
          node --check client/audio.js
          node --check client/ragdoll.js
          node --check client/soldier_skin.js
          node --check client/combat_plus.js
          node --check client/playground.js
          node --check client/input_guard.js
          node --check client/active_ragdoll_plus.js
          node --check client/warzone.js
          node --check client/weapon_auto.js
      - name: Verify warzone entrypoint
        run: |
          grep -q 'GHOSTCAM' client/index.html
          grep -q 'LIVE WARZONE' client/index.html
          grep -q './playground.js' client/index.html
          grep -q './active_ragdoll_plus.js' client/index.html
          grep -q './warzone.js' client/index.html
          grep -q './game.js' client/index.html
          grep -q './weapon_auto.js' client/index.html
          test ! -e client/camera_stability.js
          test ! -e worker/src/index.ts
      - name: Guard movement collision regression
        run: |
          # The floor must remain a Rapier collider but must never enter the X/Z obstacle list,
          # otherwise every player/AI move and every LOS query is blocked by the whole map.
          grep -Fq 'fixedBox(0,-.15,0,70,.3,70,groundMat,true,false)' client/world.js
          grep -Fq 'if(navCollide)obstacles.push' client/world.js
          # T-spawned/reset playground dummies live outside game.js soldiers[] and need their own tick.
          grep -Fq 's.__playgroundStandalone=true' client/playground.js
          grep -Fq 'if(s.__playgroundStandalone&&!s.__playgroundDisposed)s.update?.(dt,now)' client/playground.js
      - name: Guard FPS camera regression
        run: |
          # PointerLockControls must own yaw/pitch. Direct player-camera roll writes reintroduce
          # quaternion/Euler feedback and the sideways "washing machine" horizon bug.
          if grep -Eq 'camera\.rotation\.z[[:space:]]*=' client/game.js; then
            echo 'Direct camera roll assignment found in game.js' >&2
            exit 1
          fi
          grep -Fq 'camera.rotation.order="YXZ"' client/game.js
          grep -Fq 'lookEuler.z=0' client/game.js
          grep -Fq 'controls.addEventListener("change",stabiliseLook)' client/game.js
          grep -Fq 'adsFactor=aiming?.08:1' client/game.js
          grep -Fq 'bodycamLean' client/game.js
      - name: Guard active-ragdoll and combat regression
        run: |
          grep -Fq '__ghostcamActivePlus' client/active_ragdoll_plus.js
          grep -Fq 'LIVE WAR // AI ENGAGED' client/warzone.js
          grep -Fq 'setTimeout(repeat,104)' client/weapon_auto.js
