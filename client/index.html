<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="theme-color" content="#0c0e10" />
  <title>ACTIVE BODY LAB</title>
  <style>
    :root{color-scheme:dark;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    *{box-sizing:border-box}
    html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#0c0e10;color:#eef2f3}
    #game{position:fixed;inset:0;width:100%;height:100%;display:block;outline:none}
    .hud{position:fixed;inset:0;pointer-events:none;z-index:2;text-shadow:0 1px 5px #000}
    .brand{position:absolute;left:22px;top:20px;font-size:11px;font-weight:800;letter-spacing:.18em;color:rgba(238,242,243,.72)}
    .brand b{display:block;margin-top:6px;font-size:18px;letter-spacing:.08em;color:#fff}
    #status{position:absolute;left:50%;top:26px;transform:translateX(-50%);padding:8px 12px;border:1px solid rgba(255,255,255,.14);border-radius:999px;background:rgba(9,11,12,.56);backdrop-filter:blur(10px);font:700 11px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.09em;color:rgba(255,255,255,.86);white-space:nowrap}
    .controls{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);font:700 10px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.08em;color:rgba(255,255,255,.62);white-space:nowrap}
    .crosshair{position:absolute;left:50%;top:50%;width:8px;height:8px;transform:translate(-50%,-50%)}
    .crosshair:before,.crosshair:after{content:"";position:absolute;background:rgba(255,255,255,.8);box-shadow:0 0 4px rgba(0,0,0,.9)}
    .crosshair:before{left:3px;top:0;width:1px;height:8px}.crosshair:after{left:0;top:3px;width:8px;height:1px}
    .hint{position:absolute;right:22px;top:20px;text-align:right;font:600 10px ui-monospace,SFMono-Regular,Menlo,monospace;line-height:1.55;color:rgba(255,255,255,.48)}
    .vignette{position:absolute;inset:0;background:radial-gradient(circle at center,transparent 58%,rgba(0,0,0,.36) 100%)}
    @media(max-width:700px){.controls{white-space:normal;width:90%;text-align:center}.hint{display:none}}
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/",
      "@dimforge/rapier3d-compat": "https://esm.sh/@dimforge/rapier3d-compat@0.19.0"
    }
  }
  </script>
</head>
<body>
  <canvas id="game"></canvas>
  <div class="hud">
    <div class="vignette"></div>
    <div class="brand">ORIGINAL ACTIVE-RAGDOLL PROTOTYPE<b>ACTIVE BODY LAB</b></div>
    <div id="status">CLICK TO ENTER</div>
    <div class="crosshair"></div>
    <div class="controls">WASD MOVE · LMB SHOOT · RMB AIM · R RESET · ESC RELEASE MOUSE</div>
    <div class="hint">ONE HUMAN<br>ONE WEAPON<br>PHYSICS FIRST</div>
  </div>
  <script type="module" src="./euphoria_lab.js"></script>
</body>
</html>
